name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked PDF and Excel files
        shell: bash
        run: |
          if git ls-files '*.pdf' '*.xlsx' | grep -q .; then
            echo 'PDF/XLSX files must remain local and untracked.'
            git ls-files '*.pdf' '*.xlsx'
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_sqlite, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:js

      - name: Build frontend
        run: npm run build

      - name: Run SQLite tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
